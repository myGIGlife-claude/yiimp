# Zcash family, Equihash 200,9: ZEC, KMD, ARRR (Pirate), and the other Zcash forks
# ZIP-301 stratum (mining.set_target, 32 byte header nonce = 4 byte nonce1 + 28 byte nonce2,
# submit [worker, job, time, nonce2, solution]): lolMiner, GMiner, miniZ, Bminer, the ASICs...
# Share difficulty 1 = target 0x0007ffff... = 8192 solutions (NOMP/MiningCore), stored as is in
# the shares table (the web shows Sol/s with a 2^23 hashrate constant for the equihash algos).
# A 420 kSol/s ASIC finds a share of difficulty 512 every ~10 s.
# The daemon builds the coinbase (getblocktemplate coinbasetxn: founders reward, funding
# streams...): it pays its -mineraddress (zcashd, set it to the pool wallet address) or a
# key of its wallet (Komodo, Pirate and the older forks).
[TCP]
server = yaamp.com
port = 9600
password = tu8tu5

[SQL]
host = yaampdb
database = yaamp
username = root
password = patofpaq

[STRATUM]
algo = equihash
difficulty = 32
diff_min = 1
diff_max = 131072
nicehash = 64
max_ttf = 50000
; the ZIP-301 protocol has no extranonce/reconnect messages, and no rented remote jobs
reconnect = 0
renting = 0
; Equihash parameters and personalization (the default is the one of the algo, then of the
; coin): zcashd -regtest uses 48,5
;equihash_n = 48
;equihash_k = 5
;equihash_personalization = ZcashPoW
; header: auto (zcash when the template has coinbasetxn/defaultroots/finalsaplingroothash,
; else btg), zcash or btg
;equihash_header = auto

; personalization per coin symbol (first 8 characters), e.g. Komodo asset chains with their
; own n,k use NandKPoW
[EQUIHASH]
;KMD = ZcashPoW
