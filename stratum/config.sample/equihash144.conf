# Zcash family, Equihash 144,5 (Zhash): BTG (BgoldPoW), BTCZ (BitcoinZ), GLINK (sngemPoW)...
# ZIP-301 stratum, see equihash.conf. The personalization depends on the coin: BTG
# BgoldPoW, BTCZ BitcoinZ, GLINK sngemPoW, BTH BethdPoW are built in, the others can be
# set below ([EQUIHASH] <symbol> = <personalization>, default BgoldPoW for this algo).
# Bitcoin Gold has a Bitcoin getblocktemplate (the pool builds the coinbase, enable segwit
# in the coin settings, usesegwit):
# its header has nHeight and 28 zero bytes in place of hashFinalSaplingRoot, and the
# template gives the Equihash parameters (equihashn/equihashk).
# Share difficulty 1 = 8192 solutions: a 100 Sol/s GPU finds a share of difficulty 0.1 every ~8 s.
[TCP]
server = yaamp.com
port = 9601
password = tu8tu5

[SQL]
host = yaampdb
database = yaamp
username = root
password = patofpaq

[STRATUM]
algo = equihash144
difficulty = 0.1
diff_min = 0.01
diff_max = 64
nicehash = 1
max_ttf = 50000
reconnect = 0
renting = 0
;equihash_personalization = BgoldPoW

[EQUIHASH]
;LTZ = LitecoinZ
