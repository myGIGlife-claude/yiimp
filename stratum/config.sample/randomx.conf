# Monero (XMR) and RandomX CryptoNote coins, with monerod (not a Bitcoin daemon)
# xmrig / CryptoNote stratum protocol (login, job, submit, keepalived), for xmrig,
# XMRig-proxy, SRBMiner... The pool talks to monerod over its JSON-RPC (/json_rpc,
# get_block_template, submit_block): the coin needs rpcencoding XMR, rpchost/rpcport of
# monerod (rpcuser/rpcpasswd = its --rpc-login, basic or digest) and master_wallet = the
# pool wallet address (the blocks pay it directly, the web pays the miners from the
# monero-wallet-rpc of that wallet). monerod needs
#   --block-notify '/var/stratum/blocknotify 127.0.0.1:9701 <coinid> %s'
# (the stratum also polls the block count every randomx_poll_ms).
# Share difficulty = hashes (CryptoNote convention): a 10 kH/s CPU finds a share of
# difficulty 100000 every ~10 s. The shares are verified in RandomX light mode (no 2 GB
# dataset): 256 MiB per seed hash, the current and next seeds plus one spare (up to
# ~800 MiB), and ~2 MiB per concurrent verification.
[TCP]
