[STRATUM]
algo = randomx
difficulty = 20000
diff_min = 1000
diff_max = 10000000000
nicehash = 200000
max_ttf = 50000
; no extranonce/reconnect messages, and no rented remote jobs
reconnect = 0
renting = 0
; new block detection (ms, 0 = only blocknotify and the 20 s refresh)
randomx_poll_ms = 1000
; RandomX v2 (only when the coin forks to it), xmrig algo name
randomx_v2 = 0
randomx_algo = rx/0
