# Evrmore (EVR)
# KawPoW stratum protocol (mining.set_target, 64 bit nonces with a 2 byte prefix,
# header hash + mix hash submits): kawpowminer, T-Rex, NBMiner, TeamRedMiner, SRBMiner...
# The share difficulty is the kawpow pool one (difficulty 1 = target 0x00000000ff00...
# (0xffff for firopow/sccpow), about 2^32 hashes): a 30 MH/s GPU finds a share of
# difficulty 0.1 every ~15 s. Each share is verified from the light cache of the epoch
# (16 MB + 128 KB per epoch, built once in a few seconds; the current and next epoch of each coin are kept).
